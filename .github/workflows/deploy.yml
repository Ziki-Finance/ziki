name: Deploy (Cloudflare)

# CR-002 / D-016: every push to main deploys to Cloudflare Workers, but only after the CI
# workflow succeeds on that commit and Malware Scan (CI Gate) has succeeded too.
# Never deploys when either fails or is skipped. Replaces the Coolify webhook deploy.
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Supabase session pooler, for migrations)
# Repository variable:  APP_URL (the Worker's public URL, e.g. https://ziki-finance.<subdomain>.workers.dev)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Malware Scan (CI Gate)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "Verifying Malware Scan (CI Gate) for commit $HEAD_SHA in $GH_REPO..."

          ELAPSED=0
          TIMEOUT=600
          while true; do
            STATUS=$(gh run list --repo "$GH_REPO" --commit "$HEAD_SHA" --branch "$HEAD_BRANCH" --event push --workflow "Malware Scan (CI Gate)" --json status,conclusion --jq '.[0] // empty')
            if [[ -n "$STATUS" ]]; then
              RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
              RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
              echo "Malware Scan status: $RUN_STATUS, conclusion: $RUN_CONCLUSION"

              if [[ "$RUN_STATUS" == "completed" ]]; then
                if [[ "$RUN_CONCLUSION" != "success" ]]; then
                  echo "Malware Scan (CI Gate) did not succeed (conclusion: $RUN_CONCLUSION). Aborting deployment."
                  exit 1
                fi
                echo "Malware Scan (CI Gate) succeeded!"
                break
              fi
            else
              echo "Waiting for Malware Scan (CI Gate) run to be registered..."
            fi

            if [[ $ELAPSED -ge $TIMEOUT ]]; then
              echo "Timed out waiting for Malware Scan (CI Gate)"
              exit 1
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      - name: Check deploy settings
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          missing=()
          [[ "$HAS_TOKEN" == "true" ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ "$HAS_ACCOUNT" == "true" ]] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [[ "$HAS_DB" == "true" ]] || missing+=("secret DATABASE_URL")
          [[ -n "$APP_URL" ]] || missing+=("variable APP_URL")
          if (( ${#missing[@]} )); then
            printf 'Missing repository settings: %s\n' "${missing[*]}"; exit 1
          fi

      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations run before the new code goes live, so the code never meets an older schema.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time only. The live Worker reads its real secrets from Cloudflare.
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "ci-build-secret-dummy-must-be-long-enough-32-chars"
          # next.config.ts bakes NEXTAUTH_URL into the build.
          NEXTAUTH_URL: ${{ vars.APP_URL }}/api/auth
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm cf:deploy

      - name: Check the deployed app answers
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/api/health" || true)
            echo "Attempt $attempt: /api/health returned $CODE"
            [[ "$CODE" == "200" ]] && exit 0
            sleep 10
          done
          echo "The deployed app did not answer /api/health with 200"; exit 1
